
services:
  postgres:
    image: postgres:17-alpine
    container_name: auto-service-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auto_service
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auto_service"]
      interval: 3s
      timeout: 5s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data:rw,size=512m

  mongodb:
    image: mongo:8
    container_name: auto-service-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    ports:
      - "27017:27017"
    tmpfs:
      - /data/db:rw,size=512m
      - /data/configdb:rw,size=64m

  db-seed:
    build:
      context: .
      dockerfile: Dockerfile.seed
    container_name: auto-service-db-seed
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/auto_service?schema=public
    command:
      [
        "sh",
        "-c",
        "npx prisma migrate deploy && npx prisma db seed",
      ]
